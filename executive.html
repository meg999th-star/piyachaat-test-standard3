<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ข้อมูลผู้บริหาร - วิทยาลัยเทคโนโลยีตัวอย่าง</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- ================= ส่วนหัวแบบไม่ใช้รูปภาพโลโก้ ================= -->
<header class="main-header">
    <div class="logo-container">
        <!-- ใช้กล่องข้อความอักษรย่อแทนรูปภาพ -->
        <div class="text-logo">ETC</div> 
        <div>
            <h1>วิทยาลัยเทคโนโลยีตัวอย่าง</h1>
            <p>Example Technological College</p>
        </div>
    </div>
    <nav class="navbar">
        <!-- เมนูหลักตามปกติ -->
    </nav>
</header>

    <main class="container">
        <h2 class="page-title">คณะผู้บริหารสถานศึกษา</h2>
        <div class="grid-container">
            <div class="card">
                <img src="images/executive1.png" alt="ผู้อำนวยการ">
                <h3>ดร.สมชาย มั่นคง</h3>
                <p>ผู้อำนวยการวิทยาลัย</p>
            </div>
            <div class="card">
                <img src="images/executive2.png" alt="รองผู้อำนวยการ">
                <h3>นางสาววิภาดา ดีเยี่ยม</h3>
                <p>รองผู้อำนวยการฝ่ายวิชาการ</p>
            </div>
        </div>
    </main>

    <footer class="main-footer">
        <p>&copy; 2026 วิทยาลัยเทคโนโลยีตัวอย่าง. All Rights Reserved.</p>
    </footer>
</body>
</html>
